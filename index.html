<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pati Dünyası | Kediler ve Özellikleri</title>
    <style>
        :root {
            --bg-black: #0a0a0a;
            --card-dark: #141414;
            --card-hover: #1e1e1e;
            --border-gray: #2c2c2c;
            --text-white: #f5f5f5;
            --text-gray: #a3a3a3;
            --accent-silver: #d4d4d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Navigasyon Çubuğu */
        header {
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .nav-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-gray);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            color: var(--text-white);
            background-color: var(--card-hover);
        }

        .nav-btn.active {
            color: var(--bg-black);
            background-color: var(--text-white);
            font-weight: 600;
        }

        /* Ana İçerik Alanı */
        main {
            max-width: 960px;
            width: 100%;
            margin: 35px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Sekme / Bölüm Geçiş Animasyonu */
        .tab-section {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
